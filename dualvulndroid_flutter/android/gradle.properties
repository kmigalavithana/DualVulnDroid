org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Phase 10C: this project lives on F: while the pub cache (containing
# plugin Kotlin sources, e.g. device_info_plus) lives on C:. Kotlin's
# incremental compiler tries to compute a path relative to the project
# root for its build cache and throws (IllegalArgumentException: "this
# and base files have different roots") when the two are on different
# Windows drive letters - a real, reproducible toolchain bug in this
# environment, not a project code issue. Disabling incremental
# compilation avoids it at the cost of slower rebuilds.
kotlin.incremental=false
